
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Night Hub V3 | Key System</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

:root {
  --white: #fff;
  --silver: #bdbdbd;
  --black: #050505;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px 15px;
  overflow-x: hidden;
  color: white;
  font-family: Inter, sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%, #303030, transparent 48%),
    radial-gradient(ellipse at 100% 100%, #202020, transparent 38%),
    #050505;
}

/* Nền lưới mờ, không có sọc ngang */
.grid-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .18;
  background-image:
    linear-gradient(#ffffff0b 1px, transparent 1px),
    linear-gradient(90deg, #ffffff0b 1px, transparent 1px);
  background-size: 42px 42px;
  animation: gridMove 25s linear infinite;
  mask-image: linear-gradient(to bottom, black, transparent);
}

.ambient {
  position: fixed;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: white;
  filter: blur(110px);
  opacity: .12;
  pointer-events: none;
  animation: ambientMove 10s ease-in-out infinite alternate;
}
.ambient.a { top: 5%; left: -180px; }
.ambient.b {
  right: -180px;
  bottom: 5%;
  background: #999;
  animation-delay: -5s;
}

#particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.particle {
  position: absolute;
  bottom: -15px;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 10px #fff, 0 0 20px #aaa;
  opacity: 0;
  animation: rise var(--duration) linear infinite;
  animation-delay: var(--delay);
}

.container {
  width: 100%;
  max-width: 460px;
  position: relative;
  z-index: 2;
  animation: enter .9s ease both;
}

.topline {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 23px;
  color: #aaa;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 4px;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 12px white;
  animation: pulse 1.5s infinite;
}

.card {
  position: relative;
  padding: 34px 27px 25px;
  overflow: hidden;
  border: 1px solid #ffffff35;
  border-radius: 24px;
  background: rgba(17,17,17,.92);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 25px 80px #000a, 0 0 35px #ffffff09;
  transition: border-color .3s, box-shadow .3s;
}

.card:hover {
  border-color: #ffffff75;
  box-shadow: 0 25px 80px #000a, 0 0 35px #ffffff12;
}

.logo-wrap {
  width: 112px;
  height: 112px;
  position: relative;
  display: grid;
  place-items: center;
  margin: 0 auto 22px;
}

.orbit {
  position: absolute;
  inset: 0;
  border: 1px solid #ffffff55;
  border-radius: 29px;
  transform: rotate(45deg);
  animation: orbit 10s linear infinite;
}

.orbit::before,
.orbit::after {
  content: "";
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 12px white;
}
.orbit::before { top: -3px; left: 50%; }
.orbit::after { bottom: -3px; right: 20%; }

.orbit.second {
  inset: 9px;
  border-style: dashed;
  border-color: #ffffff40;
  animation-direction: reverse;
  animation-duration: 15s;
}

.logo {
  width: 76px;
  height: 76px;
  display: grid;
  place-items: center;
  border-radius: 22px;
  background: linear-gradient(145deg, white, #999 55%, #333);
  box-shadow: 0 0 28px #ffffff20, inset 0 1px white;
  animation: float 3s ease-in-out infinite;
  transition: transform .3s;
}

.logo:hover {
  transform: scale(1.1) rotate(-7deg);
}

.logo svg {
  width: 48px;
  height: 48px;
  filter: drop-shadow(0 2px 4px #0008);
}

h1 {
  margin: 0;
  text-align: center;
  font-family: Orbitron, sans-serif;
  font-size: clamp(27px, 7vw, 35px);
  font-weight: 900;
  letter-spacing: 1px;
  color: white;
  text-shadow: 0 0 22px #ffffff35;
  animation: titleGlow 3s ease-in-out infinite;
}

.subtitle {
  margin: 12px 0 24px;
  color: #aaa;
  text-align: center;
  font-size: 12px;
  line-height: 1.8;
}

.tag {
  display: table;
  margin: 0 auto 24px;
  padding: 8px 14px;
  border: 1px solid #ffffff40;
  border-radius: 30px;
  background: #ffffff08;
  color: white;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1.5px;
  animation: tagPulse 3s ease-in-out infinite;
}

.field-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  color: #eee;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
}

.encrypted {
  color: #bbb;
  font-size: 9px;
  letter-spacing: 1px;
}

.keybox {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px;
  border: 1px solid #ffffff30;
  border-radius: 12px;
  background: #050505;
  transition: .3s;
}

.keybox:hover,
.keybox:focus-within {
  border-color: white;
  box-shadow: 0 0 18px #ffffff0d;
}

#keyInput {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: #eee;
  font: 11px monospace;
}

.icon-btn {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border: 1px solid #ffffff25;
  border-radius: 9px;
  color: white;
  background: #ffffff0b;
  cursor: pointer;
  transition: .25s;
}

.icon-btn:hover {
  color: black;
  background: white;
  transform: scale(1.05);
}

.copy-btn {
  position: relative;
  width: 100%;
  min-height: 52px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  overflow: hidden;
  border: 1px solid white;
  border-radius: 12px;
  color: black;
  background: linear-gradient(110deg, white, #c7c7c7, white);
  background-size: 200% 100%;
  box-shadow: 0 5px 25px #ffffff12;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.5px;
  cursor: pointer;
  animation: buttonShimmer 6s linear infinite;
  transition: transform .25s, box-shadow .25s;
}

.copy-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 32px #ffffff25;
}

.copy-btn:active { transform: scale(.97); }

.copy-btn span,
.copy-btn svg {
  position: relative;
  z-index: 1;
}

.notice {
  display: flex;
  gap: 10px;
  margin-top: 17px;
  padding: 12px;
  border: 1px solid #ffffff1b;
  border-radius: 10px;
  background: #ffffff04;
  color: #aaa;
  font-size: 10px;
  line-height: 1.8;
}

.notice svg {
  flex-shrink: 0;
  color: white;
}

.notice strong { color: white; }

.bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 22px;
  padding-top: 17px;
  border-top: 1px solid #ffffff18;
  color: #777;
  font-size: 9px;
  letter-spacing: .5px;
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;
}

.status i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 9px white;
  animation: pulse 1.5s infinite;
}

.toast {
  position: fixed;
  z-index: 10;
  left: 50%;
  bottom: 24px;
  width: max-content;
  max-width: calc(100vw - 30px);
  padding: 13px 19px;
  border: 1px solid #ffffff50;
  border-radius: 12px;
  color: white;
  background: #171717;
  box-shadow: 0 10px 40px #000b;
  font-size: 12px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 20px);
  transition: .3s;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@keyframes enter {
  from { opacity: 0; transform: translateY(25px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes gridMove {
  to { background-position: 42px 42px; }
}
@keyframes ambientMove {
  to { transform: translate(60px, 40px) scale(1.2); }
}
@keyframes rise {
  0% { transform: translate(0, 0); opacity: 0; }
  10% { opacity: .65; }
  85% { opacity: .4; }
  100% { transform: translate(var(--drift), -110vh); opacity: 0; }
}
@keyframes pulse {
  50% { opacity: .35; box-shadow: 0 0 2px white; }
}
@keyframes orbit {
  to { transform: rotate(405deg); }
}
@keyframes float {
  50% { transform: translateY(-5px); }
}
@keyframes titleGlow {
  50% { text-shadow: 0 0 28px #ffffff55; }
}
@keyframes tagPulse {
  50% { border-color: #ffffff80; }
}
@keyframes buttonShimmer {
  to { background-position: -200% 0; }
}

@media (max-width: 380px) {
  .card { padding: 28px 18px 22px; }
  .logo-wrap { transform: scale(.92); margin-bottom: 17px; }
  .bottom { font-size: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>
<div class="grid-bg"></div>
<div class="ambient a"></div>
<div class="ambient b"></div>
<div id="particles"></div>

<main class="container">
  <div class="topline">
    <span class="live-dot"></span>
    NIGHT SYSTEM ONLINE
  </div>

  <section class="card">
    <div class="logo-wrap">
      <div class="orbit"></div>
      <div class="orbit second"></div>
      <div class="logo">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M43 7C24 10 12 25 15 42C17 54 29 60 41 54C29 53 22 45 23 35C24 24 33 14 43 7Z"
            fill="#111" stroke="#222" stroke-width="1.5"/>
          <path d="M43 20L47 29L57 30L50 37L52 47L43 42L34 47L36 37L29 30L39 29Z"
            fill="#fff" stroke="#555" stroke-width="1"/>
          <circle cx="20" cy="17" r="2" fill="#fff"/>
          <circle cx="29" cy="11" r="1.5" fill="#aaa"/>
        </svg>
      </div>
    </div>

    <h1>NIGHT HUB V3</h1>
    <p class="subtitle">
      YOUR GATEWAY TO THE NIGHT<br>
      Premium Key System Experience
    </p>

    <div class="tag">✦ BLACK & WHITE EDITION ✦</div>

    <div class="field-label">
      <label for="keyInput">YOUR ACCESS KEY</label>
      <span class="encrypted">● KEY READY</span>
    </div>

    <div class="keybox">
      <input id="keyInput" type="password"
        value="NightHubV3NakwowojejeoLapqowhjeoeeijeiei"
        readonly spellcheck="false" aria-label="Night Hub key">

      <button class="icon-btn" id="toggleBtn"
        type="button" aria-label="Hiện key" title="Hiện hoặc ẩn key">
        <svg width="17" height="17" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <button class="copy-btn" id="copyBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2">
        <rect x="8" y="8" width="13" height="13" rx="2"/>
        <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
      </svg>
      <span>COPY ACCESS KEY</span>
    </button>

    <div class="notice">
      <svg width="17" height="17" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 11v5M12 8h.01"/>
      </svg>
      <div>
        <strong>IMPORTANT NOTICE</strong><br>
        Nhấn nút bên trên để sao chép key. Nếu không sao chép được,
        hãy thử mở trang bằng Safari hoặc Chrome.
      </div>
    </div>

    <div class="bottom">
      <span>© NIGHT HUB V3</span>
      <span class="status"><i></i>SYSTEM READY</span>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  ✓ Đã sao chép key!
</div>

<script>
const keyInput = document.getElementById('keyInput');
const toggleBtn = document.getElementById('toggleBtn');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
let toastTimer;

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

toggleBtn.addEventListener('click', () => {
  const hidden = keyInput.type === 'password';
  keyInput.type = hidden ? 'text' : 'password';
  toggleBtn.setAttribute('aria-label', hidden ? 'Ẩn key' : 'Hiện key');
});

copyBtn.addEventListener('click', async () => {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(keyInput.value);
    } else {
      const temp = document.createElement('textarea');
      temp.value = keyInput.value;
      temp.style.position = 'fixed';
      temp.style.left = '-9999px';
      document.body.appendChild(temp);
      temp.select();
      const success = document.execCommand('copy');
      temp.remove();
      if (!success) throw new Error('Copy failed');
    }

    showToast('✓ NIGHT HUB V3 KEY COPIED!');
    copyBtn.querySelector('span').textContent = 'KEY COPIED!';
    setTimeout(() => {
      copyBtn.querySelector('span').textContent = 'COPY ACCESS KEY';
    }, 2000);
  } catch {
    keyInput.type = 'text';
    keyInput.focus();
    keyInput.select();
    showToast('Hãy chọn key và sao chép thủ công nhé!');
  }
});

// Tạo các hạt sáng trắng chuyển động
const particles = document.getElementById('particles');

for (let i = 0; i < 65; i++) {
  const p = document.createElement('span');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.setProperty('--size', (1 + Math.random() * 3) + 'px');
  p.style.setProperty('--duration', (7 + Math.random() * 13) + 's');
  p.style.setProperty('--delay', (-Math.random() * 18) + 's');
  p.style.setProperty('--drift', (-70 + Math.random() * 140) + 'px');
  particles.appendChild(p);
}
</script>
</body>
</html>
